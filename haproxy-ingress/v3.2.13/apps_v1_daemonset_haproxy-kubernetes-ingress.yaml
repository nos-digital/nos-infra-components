apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    run: haproxy-ingress
  name: haproxy-kubernetes-ingress
  namespace: haproxy-controller
spec:
  selector:
    matchLabels:
      run: haproxy-ingress
  template:
    metadata:
      labels:
        run: haproxy-ingress
    spec:
      containers:
      - args:
        - --configmap=haproxy-controller/haproxy-kubernetes-ingress
        env:
        - name: TZ
          value: Etc/UTC
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        image: haproxytech/kubernetes-ingress
        livenessProbe:
          httpGet:
            path: /healthz
            port: 1042
        name: haproxy-ingress
        ports:
        - containerPort: 8080
          hostPort: 8080
          name: http
        - containerPort: 8443
          hostPort: 8443
          name: https
        - containerPort: 1024
          hostPort: 1024
          name: stat
        resources:
          limits:
            memory: 2560Mi
          requests:
            memory: 2048Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - NET_BIND_SERVICE
            drop:
            - ALL
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
      serviceAccountName: haproxy-kubernetes-ingress
